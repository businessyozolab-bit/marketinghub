<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Marketing OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6f1;--sf:#fff;--tx:#1f1a17;--mu:#7a6f66;--ac:#b3261e;--ac2:#fbe9e7;--bd:#e6ddd3;--ok:#1b7a3d;--wa:#b3261e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--sf:#221c17;--tx:#f3ebe3;--mu:#a89b8f;--ac:#ff7a6e;--ac2:#3a1f1c;--bd:#3a322b;--ok:#5fd18a;--wa:#ff7a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--sf:#221c17;--tx:#f3ebe3;--mu:#a89b8f;--ac:#ff7a6e;--ac2:#3a1f1c;--bd:#3a322b;--ok:#5fd18a;--wa:#ff7a6e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:17px;margin:0}h1 span{color:var(--ac)}h2{font-size:16px;margin:20px 0 8px}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx)}input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}
input[type=checkbox]{width:18px;height:18px}.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}.g{background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px}.mu{color:var(--mu);font-size:13px}.bad{color:var(--wa);font-weight:700}.good{color:var(--ok);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{background:var(--ac2);color:var(--ac);border-radius:999px;padding:2px 10px;font-size:13px}
#login{max-width:380px;margin:12vh auto;padding:0 16px}#login .card{display:grid;gap:10px}#login input,#login select{width:100%;padding:10px}
.ban{background:var(--ac2);color:var(--ac);padding:8px 16px;font-size:13px}dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(460px,92vw)}dialog label{display:block;margin:8px 0 3px}dialog input,dialog select,dialog textarea{width:100%}
</style></head><body>
<div id="app"></div>
<dialog id="dlg"><b>Tambah program</b>
<label>Nama program</label><input id="pn" placeholder="mis. Merchandise">
<label>Template</label><select id="pt"><option value="stok">Stok (masuk/keluar, alert refill)</option><option value="jadwal">Jadwal (tanggal, jam, hadir)</option><option value="tabel">Tabel bebas</option></select>
<div id="pfw" hidden><label>Kolom (satu per baris, format Nama:tipe)</label><textarea id="pf" rows="5" placeholder="Nama:teks&#10;Jumlah:angka&#10;Status:pilihan(Baru,Selesai)"></textarea><div class="mu">Tipe: teks, angka, tanggal, jam, centang, link, pilihan(a,b,c)</div></div>
<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="g" onclick="dlg.close()">Batal</button><button class="b" onclick="addProg()">Simpan</button></div></dialog>
<dialog id="pv" style="max-width:96vw"></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ISI dengan config Firebase project kamu (Project settings > Your apps > Web app)
const FIREBASE_CONFIG={apiKey:"AIzaSyCG9OFaN24eFDZ8UuLGzmW9EBrsYhrG0Es",authDomain:"marketingxoutlet.firebaseapp.com",projectId:"marketingxoutlet",storageBucket:"marketingxoutlet.firebasestorage.app",messagingSenderId:"89448768399",appId:"1:89448768399:web:7bb8b68663e16c5226a1fa"};
const DEF=[{id:'soora',name:'Soora Sushi Club',outlets:['Fujiyama','Tugu','Bekasi','Surabaya']}];
const BR=()=>S.cfg.brands&&S.cfg.brands.length?S.cfg.brands:DEF;
let OUT=DEF[0].outlets;
const PASS=(b,o)=>((S.cfg.pass||{})[b+'|'+o])||(b+'-'+(o==='ALL'?'admin':o.toLowerCase()));
function setB(b){const x=BR().find(z=>z.id===b)||BR()[0];S.b=x.id;OUT=x.outlets}
const BN=()=>(BR().find(z=>z.id===S.b)||BR()[0]).name;
const SF=[{k:'tgl',l:'Tanggal',t:'date'},{k:'tipe',l:'Tipe',t:'select',o:['Masuk','Keluar']},{k:'qty',l:'Jumlah',t:'number'},{k:'cat',l:'Catatan',t:'text'}];
const KF=[{k:'akun',l:'Akun KOL',t:'text'},{k:'tgl',l:'Tanggal',t:'date'},{k:'jam',l:'Jam',t:'time'},{k:'hadir',l:'Hadir',t:'check'},{k:'fa',l:'Foto akun',t:'photo'},{k:'fb',l:'Foto bill',t:'photo'}];
const BUILT=[{id:'stiker',name:'Stiker Pack',tpl:'stok',f:SF,min:20},{id:'card',name:'Experience Card',tpl:'stok',f:SF,min:20},{id:'kol',name:'Weekly KOL',tpl:'jadwal',f:KF}];
const RES_CFG={apiKey:"AIzaSyCZoUUNtqL18la85zuAgKtPZRE7VM8pQBk",authDomain:"supervisi-medsos.firebaseapp.com",projectId:"supervisi-medsos",storageBucket:"supervisi-medsos.firebasestorage.app"};
const RES_URL='https://tinyurl.com/officialreservasissc';
let rdb=null;
let S={u:null,rows:[],pr:[],rs:[],ros:{},rf:'today',cfg:{},ph:{},b:'soora',v:'dash',fo:'ALL'},db=null,app=document.getElementById('app'),dlg=document.getElementById('dlg'),dl=null;
try{S.u=sessionStorage.getItem('u');S.b=sessionStorage.getItem('b')||'soora'}catch(e){}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const isAll=()=>S.u==='ALL';const vis=()=>isAll()?OUT:[S.u];
function progs(){const m={};BUILT.forEach(b=>m[b.id]={...b});S.pr.filter(p=>(p.b||'soora')===S.b).forEach(p=>{const id=p.bid||p.id;m[id]=BUILT.find(b=>b.id===id)?{...m[id],...p,id,f:m[id].f}:{...p,id}});return Object.values(m).filter(p=>!p.del)}
const P=id=>progs().find(p=>p.id===id);
const RW=()=>S.rows.filter(r=>(r.b||'soora')===S.b);
function sisa(p,o){let s=0;RW().forEach(r=>{if(r.p===p.id&&r.o===o){const q=+r.d.qty||0;s+=r.d.tipe==='Keluar'?-q:q}});return s}
function wr(col,id,data){if(!db)return Promise.resolve(false);return db.collection(col).doc(id).set(data).then(()=>true).catch(e=>{alert('Gagal menyimpan ke Firebase ('+(e.code||e.message)+'). Cek Rules Firestore dan pastikan database sudah dibuat.');return false})}
function saveRow(r){const i=S.rows.findIndex(x=>x.id===r.id);i<0?S.rows.push(r):S.rows[i]=r;wr('os_rows',r.id,{p:r.p,o:r.o,d:r.d,b:r.b||S.b,ts:r.ts})}
function delRow(id){const r0=S.rows.find(r=>r.id===id);if(db&&r0)['fa','fb'].forEach(k=>{if(r0.d[k])db.collection('os_photos').doc(r0.d[k]).delete().catch(()=>{})});S.rows=S.rows.filter(r=>r.id!==id);if(db)db.collection('os_rows').doc(id).delete().catch(()=>{});render()}
function saveProg(p){const i=S.pr.findIndex(x=>x.id===p.id);i<0?S.pr.push(p):S.pr[i]=p;const c={...p};delete c.id;wr('os_programs',p.id,c)}
function loginOuts(){const b=BR().find(z=>z.id===document.getElementById('lb').value)||BR()[0];document.getElementById('lo').innerHTML='<option value="ALL">Semua outlet (Marketing)</option>'+b.outlets.map(o=>'<option>'+esc(o)+'</option>').join('')}
function login(){const b=document.getElementById('lb').value,o=document.getElementById('lo').value;if(document.getElementById('lp').value!==PASS(b,o)){document.getElementById('le').textContent='Password salah';return}S.u=o;S.b=b;try{sessionStorage.setItem('u',o);sessionStorage.setItem('b',b)}catch(e){}S.v='dash';render()}
function logout(){S.u=null;try{sessionStorage.removeItem('u')}catch(e){}render()}
function go(v){S.v=v;render()}
function render(){
if(S.u)setB(S.b);
if(!S.u){app.innerHTML='<div id="login"><h1 style="text-align:center;font-size:22px">Marketing OS</h1><div class="card"><label>Brand</label><select id="lb" onchange="loginOuts()">'+BR().map(b=>'<option value="'+esc(b.id)+'">'+esc(b.name)+'</option>').join('')+'</select><label>Outlet</label><select id="lo"><option value="ALL">Semua outlet (Marketing)</option>'+BR()[0].outlets.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select><label>Password</label><input id="lp" type="password" onkeydown="if(event.key===\'Enter\')login()"><div id="le" class="bad"></div><button class="b" onclick="login()">Masuk</button></div></div>';return}
const ps=progs();let h='<header><h1><span>'+esc(BN())+'</span> Marketing OS</h1><div class="row"><span class="pill">'+(isAll()?'Semua outlet':esc(S.u))+'</span><button class="g" onclick="logout()">Keluar</button></div></header>';
if(!db)h+='<div class="ban">Firebase belum dikonfigurasi: isi FIREBASE_CONFIG di index.html. Data belum tersimpan permanen.</div>';
h+='<nav><button class="'+(S.v==='dash'?'on':'')+'" onclick="go(\'dash\')">Dashboard</button>'+ps.filter(p=>p.tpl!=='mp').map(p=>'<button class="'+(S.v===p.id?'on':'')+'" onclick="go(\''+p.id+'\')">'+esc(p.name)+'</button>').join('')+'<button class="'+(S.v==='res'?'on':'')+'" onclick="go(\'res\')">Reservasi</button>'+(isAll()?'<button onclick="dlg.showModal()">+ Program</button><button class="'+(S.v==='admin'?'on':'')+'" onclick="go(\'admin\')">Admin</button>':'')+'</nav><div class="wrap">';
h+=S.v==='dash'?dash(ps):S.v==='res'?resv():S.v==='admin'&&isAll()?admin(ps):prog(P(S.v)||ps[0]);
app.innerHTML=h+'</div>'}
function dash(ps){const st=ps.filter(p=>p.tpl==='stok'),ko=ps.filter(p=>p.tpl==='jadwal'),tb=ps.filter(p=>p.tpl==='tabel');
let h='<h2>Stok</h2><div class="card sc"><table><tr><th>Outlet</th>'+st.map(p=>'<th>'+esc(p.name)+'</th>').join('')+'</tr>'+vis().map(o=>'<tr><td>'+o+'</td>'+st.map(p=>{const s=sisa(p,o),l=s<(+p.min||0);return'<td class="'+(l?'bad':'good')+'">'+s+(l?' · refill':'')+'</td>'}).join('')+'</tr>').join('')+'</table></div>';
h+='<h2>KOL hari ini</h2><div class="card">';const t=[];ko.forEach(p=>RW().forEach(r=>{if(r.p===p.id&&r.d.tgl===today()&&vis().includes(r.o))t.push({p,r})}));
h+=t.length?'<table>'+t.sort((a,b)=>(a.r.d.jam||'').localeCompare(b.r.d.jam||'')).map(({r})=>'<tr><td>'+esc(r.d.jam||'-')+'</td><td>'+esc(r.d.akun)+'</td><td>'+r.o+'</td><td>'+(r.d.hadir?'<span class="good">✓ hadir</span>':'<span class="mu">belum</span>')+'</td></tr>').join('')+'</table>':'<span class="mu">Tidak ada jadwal KOL hari ini.</span>';
h+='</div>';if(tb.length)h+='<h2>Program lain</h2><div class="grid">'+tb.map(p=>'<div class="card"><b>'+esc(p.name)+'</b><div class="mu">'+RW().filter(r=>r.p===p.id&&vis().includes(r.o)).length+' data</div><button class="g" onclick="go(\''+p.id+'\')">Buka</button></div>').join('')+'</div>';return h}
function wl(){return'<h2>Waiting list</h2><div class="card"><span class="mu">Antrean greeter (nama, jumlah pax). Masih dalam pengembangan, akan dihubungkan di tahap berikutnya.</span></div>'}
function rsAct(id,a){if(!rdb)return;rdb.collection('reservations').doc(id).update({status:a,completedAt:new Date().toISOString()}).catch(e=>alert('Gagal menyimpan: '+(e.code||e.message)))}
function rsTog(o){if(!rdb)return;rdb.collection('outlet_status').doc(o).set({open:S.ros[o]===false}).catch(e=>alert('Gagal menyimpan: '+(e.code||e.message)))}
function resv(){
if(S.b!=='soora')return'<h2>Reservasi</h2><div class="card mu">Reservasi untuk brand ini belum dihubungkan.</div>'+wl();
const mgr=!isAll(),os=['Fujiyama','Tugu','Bekasi'].filter(o=>vis().includes(o));
let h='<div class="row" style="justify-content:space-between"><h2 style="margin:12px 0">Reservasi</h2><a href="'+RES_URL+'" target="_blank" rel="noopener"><button class="g">Buka form customer</button></a></div>';
if(!os.length)return h+'<div class="card mu">Outlet ini belum memakai sistem reservasi.</div>'+wl();
if(!rdb)h+='<div class="card bad">Belum terhubung ke database reservasi.</div>';
h+='<div class="grid">'+os.map(o=>{const op=S.ros[o]!==false,n=S.rs.filter(r=>r.outlet===o&&r.tanggal===today()&&(!r.status||r.status==='baru')).length;return'<div class="card"><b>'+o+'</b><div class="mu">Hari ini menunggu: '+n+'</div><div class="'+(op?'good':'bad')+'">'+(op?'Reservasi dibuka':'Reservasi ditutup')+'</div>'+(mgr?'<p><button class="g" onclick="rsTog(\''+o+'\')">'+(op?'Tutup reservasi':'Buka kembali')+'</button></p>':'')+'</div>'}).join('')+'</div>';
let L=S.rs.filter(r=>os.includes(r.outlet)&&(S.fo==='ALL'||!isAll()||r.outlet===S.fo));if(S.rf==='today')L=L.filter(r=>r.tanggal===today());
L.sort((x,y)=>((x.tanggal||'')+(x.jam||'')).localeCompare((y.tanggal||'')+(y.jam||'')));
h+='<div class="row" style="margin:12px 0"><button class="'+(S.rf==='today'?'b':'g')+'" onclick="S.rf=\'today\';render()">Hari ini</button><button class="'+(S.rf==='all'?'b':'g')+'" onclick="S.rf=\'all\';render()">Semua</button>'+(isAll()?'<select onchange="S.fo=this.value;render()"><option value="ALL">Semua outlet</option>'+os.map(o=>'<option'+(S.fo===o?' selected':'')+'>'+o+'</option>').join('')+'</select>':'')+'</div>';
h+='<div class="card sc"><table><tr><th>Tanggal</th><th>Jam</th><th>Nama</th><th>Pax</th>'+(isAll()?'<th>Outlet</th>':'')+'<th>Catatan</th><th>Status</th><th></th></tr>'+L.map(r=>{const st=r.status==='selesai'?'<span class="good">Selesai</span>':r.status==='dibatalkan_sistem'?'<span class="bad">Tidak datang</span>':'<span class="mu">Menunggu</span>';const act=mgr&&(!r.status||r.status==='baru')?'<button class="g" onclick="rsAct(\''+r._id+'\',\'selesai\')">Selesai</button> <button class="g" onclick="rsAct(\''+r._id+'\',\'dibatalkan_sistem\')">Tidak datang</button>':'';return'<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.jam)+'</td><td>'+esc(r.nama)+'</td><td>'+(r.jumlah||0)+'</td>'+(isAll()?'<td>'+esc(r.outlet)+'</td>':'')+'<td>'+esc(r.catatan)+'</td><td>'+st+'</td><td>'+act+'</td></tr>'}).join('')+'</table>'+(L.length?'':'<div class="mu" style="padding:10px">Belum ada reservasi.</div>')+'</div>';
return h+wl()}
function inp(f,v,a){const id=a?' data-a="'+a+'"':'';v=v==null?'':v;
if(f.t==='check')return'<input type="checkbox" data-k="'+f.k+'"'+id+(v?' checked':'')+'>';
if(f.t==='select')return'<select data-k="'+f.k+'"'+id+'>'+f.o.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
return'<input data-k="'+f.k+'"'+id+' type="'+({number:'number',date:'date',time:'time'}[f.t]||'text')+'" value="'+esc(v)+'"'+(f.t==='number'?' style="width:90px"':'')+'>'}
function ph(r,x,ed){const v=r.d[x.k];return(v?'<button class="g" onclick="viewPh(\''+v+'\')">Lihat</button> ':'<span class="mu">belum </span>')+(ed?'<label class="g" style="cursor:pointer">'+(v?'Ganti':'Upload')+'<input type="file" accept="image/*" hidden data-up="'+r.id+'|'+x.k+'"></label>':'')}
function shrink(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.7))};i.onerror=no;i.src=u})}
async function viewPh(id){let d=S.ph[id];if(!d&&db){try{const g=await db.collection('os_photos').doc(id).get();d=g.exists?g.data().data:null;if(d)S.ph[id]=d}catch(e){}}if(!d){alert('Foto tidak ditemukan');return}const pv=document.getElementById('pv');pv.innerHTML='<img src="'+d+'" style="max-width:100%;max-height:80vh;display:block;margin:0 auto"><p style="text-align:center"><button class="g" onclick="pv.close()">Tutup</button></p>';pv.showModal()}
document.addEventListener('change',async e=>{const t=e.target,u=t.dataset.up;if(!u||!t.files[0])return;const[rid,k]=u.split('|'),r=S.rows.find(x=>x.id===rid);if(!r)return;try{const data=await shrink(t.files[0]),id='ph'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);S.ph[id]=data;const ok=await wr('os_photos',id,{data,r:rid,k,b:S.b,ts:Date.now()});if(!ok&&db)return;if(r.d[k]&&db)db.collection('os_photos').doc(r.d[k]).delete().catch(()=>{});r.d={...r.d,[k]:id};saveRow(r);render()}catch(err){alert('Gagal memproses foto')}});
function can(p,x){if(isAll())return true;if(p.mgrRO)return false;if(p.tpl==='jadwal')return['hadir','fa','fb'].includes(x.k);return!(p.adm||[]).includes(x.k)}
function prog(p){if(!p)return'';const f=p.f,own=isAll()||(!p.mgrRO&&p.tpl!=='jadwal'),os=vis();let rows=RW().filter(r=>r.p===p.id&&os.includes(r.o)&&(S.fo==='ALL'||r.o===S.fo)).sort((a,b)=>(b.ts||0)-(a.ts||0));
let h='<div class="row" style="justify-content:space-between"><h2 style="margin:12px 0">'+esc(p.name)+'</h2><div class="row">'+(isAll()?'<select onchange="S.fo=this.value;render()"><option value="ALL">Semua outlet</option>'+OUT.map(o=>'<option'+(S.fo===o?' selected':'')+'>'+o+'</option>').join('')+'</select>':'')+'<button class="g" onclick="csv(\''+p.id+'\')">Export CSV</button>'+(isAll()&&!BUILT.find(b=>b.id===p.id)?'<button class="g" onclick="delProg(\''+p.id+'\')">Hapus program</button>':'')+'</div></div>';
if(p.tpl==='stok'){h+='<div class="card row">'+os.map(o=>{const s=sisa(p,o);return'<span>'+o+': <b class="'+(s<(+p.min||0)?'bad':'good')+'">'+s+'</b></span>'}).join(' · ')+'<span class="mu">Batas minimum refill:</span>'+(isAll()?'<input type="number" style="width:80px" value="'+(+p.min||0)+'" onchange="setMin(\''+p.id+'\',this.value)">':'<b>'+(+p.min||0)+'</b>')+'</div>'}
if(own){h+='<div class="card sc"><div class="row" id="af">'+(isAll()?'<select data-k="_o">'+OUT.map(o=>'<option>'+o+'</option>').join('')+'</select>':'')+f.filter(x=>x.t!=='photo'&&(isAll()||!(p.adm||[]).includes(x.k))).map(x=>'<label class="mu">'+esc(x.l)+' '+inp(x,x.t==='date'?today():'')+'</label>').join('')+'<button class="b" onclick="addRow(\''+p.id+'\')">Tambah</button></div></div>'}
h+='<div class="card sc"><table><tr>'+(isAll()?'<th>Outlet</th>':'')+f.map(x=>'<th>'+esc(x.l)+'</th>').join('')+'<th></th></tr>'+rows.map(r=>'<tr>'+(isAll()?'<td>'+r.o+'</td>':'')+f.map(x=>'<td>'+(x.t==='photo'?ph(r,x,can(p,x)):can(p,x)?inp(x,r.d[x.k],r.id):esc(r.d[x.k]===true?'✓':r.d[x.k]))+'</td>').join('')+'<td>'+(own?'<button class="x" onclick="delRow(\''+r.id+'\')">✕</button>':'')+'</td></tr>').join('')+'</table>'+(rows.length?'':'<div class="mu" style="padding:10px">Belum ada data.</div>')+'</div>';return h}
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(!a)return;const r=S.rows.find(x=>x.id===a);if(!r)return;r.d={...r.d,[t.dataset.k]:t.type==='checkbox'?t.checked:t.value};saveRow(r);render()});
function addRow(pid){const p=P(pid),box=document.getElementById('af'),d={};let o=S.u;box.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(k==='_o')o=el.value;else d[k]=el.type==='checkbox'?el.checked:el.value});
if(p.tpl==='mp'?!d[p.f[0].k]:!Object.values(d).some(v=>v&&v!==today()))return;(p.adm||[]).forEach(k=>{if(d[k]===undefined){const x=p.f.find(z=>z.k===k);d[k]=x.o?x.o[0]:''}});saveRow({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),p:pid,o,d,b:S.b,ts:Date.now()});render()}
function setMin(id,v){const p=P(id),bi=BUILT.find(b=>b.id===id);saveProg(bi?{id:S.b+'~'+id,bid:id,b:S.b,name:p.name,tpl:p.tpl,min:+v||0}:{id,b:S.b,name:p.name,tpl:p.tpl,min:+v||0,f:p.f});render()}
function delProg(id){if(!confirm('Hapus program ini beserta tampilannya?'))return;const p=S.pr.find(x=>x.id===id);S.pr=S.pr.filter(x=>x.id!==id);if(db)db.collection('os_programs').doc(id).delete().catch(()=>{});S.v='dash';render()}
document.getElementById('pt').onchange=e=>{document.getElementById('pfw').hidden=e.target.value!=='tabel'};
function addProg(){const n=document.getElementById('pn').value.trim(),tpl=document.getElementById('pt').value;if(!n)return;let f=tpl==='stok'?SF:tpl==='jadwal'?KF:[];
if(tpl==='tabel'){f=document.getElementById('pf').value.split('\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>{const[l,tp='teks']=s.split(':').map(x=>x.trim());const m=tp.match(/^pilihan\((.*)\)$/i);const t=m?'select':{angka:'number',tanggal:'date',jam:'time',centang:'check',link:'link'}[tp.toLowerCase()]||'text';return{k:'c'+i,l,t,...(m?{o:m[1].split(',').map(x=>x.trim())}:{})}});if(!f.length)f=[{k:'c0',l:'Nama',t:'text'},{k:'c1',l:'Catatan',t:'text'}]}
const p={id:'p'+Date.now().toString(36),b:S.b,name:n,tpl,f,...(tpl==='stok'?{min:20}:{})};saveProg(p);dlg.close();document.getElementById('pn').value='';S.v=p.id;render()}
async function csv(pid){const p=P(pid);const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';const t=[['Outlet',...p.f.map(x=>x.l)].map(q).join(',')].concat(RW().filter(r=>r.p===pid&&vis().includes(r.o)).map(r=>[r.o,...p.f.map(x=>x.t==='photo'?(r.d[x.k]?'Ada':''):r.d[x.k]===true?'Ya':r.d[x.k])].map(q).join(','))).join('\n');
try{if(dl)return await dl.save({filename:p.name+'.csv',data:t});}catch(e){}
const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(t);a.download=p.name+'.csv';a.click()}
render();
function admin(ps){const pw=S.cfg.pass||{};return'<h2>Admin · '+esc(BN())+'</h2><div class="card"><b>Password akun</b><div class="mu">Kosongkan untuk memakai password bawaan ('+esc(S.b)+'-admin atau '+esc(S.b)+'-namaoutlet).</div><div class="grid" style="margin-top:8px">'+['ALL',...OUT].map(o=>'<label class="mu">'+(o==='ALL'?'Marketing (semua outlet)':esc(o))+'<input data-pw="'+esc(o)+'" value="'+esc(pw[S.b+'|'+o]||'')+'" placeholder="bawaan" style="width:100%"></label>').join('')+'</div><p><button class="b" onclick="savePw()">Simpan password</button></p></div><div class="card"><b>Outlet brand ini</b><div class="mu">Pisahkan dengan koma.</div><input id="ol" style="width:100%" value="'+esc(OUT.join(', '))+'"><p><button class="b" onclick="saveOut()">Simpan outlet</button></p></div><div class="card sc"><b>Program</b><table>'+ps.map(p=>'<tr><td>'+esc(p.name)+'</td><td class="mu">'+p.tpl+'</td><td>'+(BUILT.find(b=>b.id===p.id)?'<span class="mu">bawaan</span>':'<button class="g" onclick="delProg(\''+p.id+'\')">Hapus</button>')+'</td></tr>').join('')+'</table></div><div class="card"><b>Tambah brand baru</b><div class="mu">Data dan program tiap brand terpisah.</div><div class="row"><input id="nb" placeholder="Nama brand"><input id="no" placeholder="Outlet, dipisah koma" style="flex:1"><button class="b" onclick="addBrand()">Tambah</button></div></div><div class="card"><b>Backup</b><p><button class="g" onclick="bak()">Unduh semua data (JSON)</button></p></div>'}
function savePw(){const o={},pre=S.b+'|';Object.keys(S.cfg.pass||{}).forEach(k=>{if(k.indexOf(pre)!==0)o[k]=S.cfg.pass[k]});document.querySelectorAll('[data-pw]').forEach(e=>{if(e.value.trim())o[pre+e.dataset.pw]=e.value.trim()});S.cfg.pass=o;wr('os_config','auth',{pass:o}).then(ok=>{if(ok)alert('Password tersimpan');else if(!db)alert('Firebase belum terhubung, password BELUM tersimpan.')})}
function saveBr(bl){S.cfg.brands=bl;wr('os_config','brands',{list:bl})}
function saveOut(){const l=document.getElementById('ol').value.split(',').map(x=>x.trim()).filter(Boolean);if(!l.length)return;saveBr(BR().map(b=>b.id===S.b?{...b,outlets:l}:b));render()}
function addBrand(){const n=document.getElementById('nb').value.trim(),l=document.getElementById('no').value.split(',').map(x=>x.trim()).filter(Boolean);if(!n||!l.length){alert('Isi nama brand dan minimal satu outlet');return}const id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'b'+Date.now().toString(36);if(BR().find(b=>b.id===id)){alert('Brand sudah ada');return}saveBr([...BR(),{id,name:n,outlets:l}]);alert('Brand ditambah. Password bawaan marketing: '+id+'-admin');render()}
function bak(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({outlets:OUT,programs:S.pr,rows:S.rows},null,1));a.download='soora-os-backup-'+today()+'.json';a.click()}
(async()=>{try{if(FIREBASE_CONFIG.apiKey.indexOf('ISI')<0&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}}catch(e){}
try{if(window.firebase){const ra=firebase.initializeApp(RES_CFG,'res');rdb=ra.firestore();const N=()=>{};rdb.collection('reservations').orderBy('createdAt','desc').limit(500).onSnapshot(sn=>{S.rs=sn.docs.map(d=>({...d.data(),_id:d.id}));if(S.v==='res')render()},N);['Fujiyama','Tugu','Bekasi'].forEach(o=>rdb.collection('outlet_status').doc(o).onSnapshot(sn=>{S.ros[o]=sn.exists?sn.data().open!==false:true;if(S.v==='res')render()},N))}}catch(e){}
if(db){const E=()=>{};db.collection('os_rows').onSnapshot(sn=>{S.rows=sn.docs.map(d=>({id:d.id,...d.data()}));render()},E);db.collection('os_programs').onSnapshot(sn=>{S.pr=sn.docs.map(d=>({id:d.id,...d.data()}));render()},E);db.collection('os_config').onSnapshot(sn=>{sn.docs.forEach(d=>{const x=d.data();if(d.id==='auth')S.cfg.pass=x.pass||{};if(d.id==='brands'&&x.list&&x.list.length)S.cfg.brands=x.list});render()},E)}else render()})();
</script></body></html>
